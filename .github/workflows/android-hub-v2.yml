name: Android Hub V2

on:
  push:
    branches:
      - main
      - feat/android-hub-v2
      - fix/android-hub-pair-crash
    paths:
      - "sensors/music/android/**"
      - ".github/workflows/android-hub-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug and unsigned release APKs
        run: gradle -p sensors/music/android --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Align unsigned release APK
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4             sensors/music/android/app/build/outputs/apk/release/app-release-unsigned.apk             sensors/music/android/app/build/outputs/apk/release/thaiduy-hub-0.5.9-release-aligned.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: thaiduy-hub-v2-apks
          path: |
            sensors/music/android/app/build/outputs/apk/debug/app-debug.apk
            sensors/music/android/app/build/outputs/apk/release/thaiduy-hub-0.5.9-release-aligned.apk
          if-no-files-found: error
