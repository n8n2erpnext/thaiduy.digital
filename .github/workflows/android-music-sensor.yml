name: Android Hub

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sensors/music/android/**'
      - '.github/workflows/android-music-sensor.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sensors/music/android

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build aligned unsigned release APK and persist diagnostics
        id: apk
        shell: bash
        run: |
          set +e
          mkdir -p ../../../artifacts/android
          rm -f ../../../artifacts/android/thaiduy-hub-release-unsigned.apk
          gradle :app:assembleRelease --stacktrace > ../../../artifacts/android/build.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
            zipalign_bin="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
            if [ -z "$zipalign_bin" ]; then
              echo "zipalign not found under $ANDROID_HOME/build-tools" >> ../../../artifacts/android/build.log
              rc=127
            else
              "$zipalign_bin" -f -p 4 "$unsigned" ../../../artifacts/android/thaiduy-hub-release-unsigned.apk >> ../../../artifacts/android/build.log 2>&1
              rc=$?
            fi
          fi
          echo "$rc" > ../../../artifacts/android/build.status
          if [ "$rc" -ne 0 ]; then
            rm -f ../../../artifacts/android/thaiduy-hub-release-unsigned.apk
          fi
          exit 0

      - name: Commit build result back to CI branch
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/android
          git diff --cached --quiet || git commit -m "ci: persist Android Hub build result [skip ci]"
          git push origin HEAD:$GITHUB_REF_NAME

      - name: Fail workflow when APK compilation failed
        shell: bash
        run: |
          test "$(cat ../../../artifacts/android/build.status)" = "0"
