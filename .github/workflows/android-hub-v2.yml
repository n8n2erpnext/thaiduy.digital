name: Android Hub V2

on:
  push:
    branches:
      - feat/android-hub-v2
    paths:
      - "sensors/music/android/**"
      - ".github/workflows/android-hub-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle -p sensors/music/android --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thaiduy-hub-v2-debug
          path: sensors/music/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
